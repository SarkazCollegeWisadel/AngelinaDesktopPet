[project]
name = "angelina-desktop-pet"
version = "0.2.0"
description = "A transparent Windows desktop companion inspired by Angelina."
requires-python = ">=3.11"
dependencies = [
  "PySide6>=6.8,<7",
  "Pillow>=10.4,<12",
]

[project.optional-dependencies]
build = ["pyinstaller>=6.11,<7"]

[tool.pytest.ini_options]
testpaths = ["tests"]
